name: setup-rust
description: Install the workspace toolchain, the shared cache and named cargo tools

inputs:
  toolchain:
    description: Toolchain the workspace builds on
    required: false
    default: "1.97"
  components:
    description: Comma separated rustup components for the workspace toolchain
    required: false
    default: ""
  tools:
    description: Comma separated tools for taiki-e/install-action
    required: false
    default: ""
  cache:
    description: Restore and save the shared cargo cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    # Macro runners are arm64 and every other runner is x86_64, so the arch keys the cache apart
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ runner.arch }}
    - if: inputs.tools != ''
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: ${{ inputs.tools }}
